# 저장 위치: errorinusermane/errorinusermane 저장소의 .github/workflows/snake.yml
# 매일 한 번 잔디 그래프를 따라가는 뱀 그림을 다시 그려 output 브랜치에 올린다.
name: generate snake

on:
  schedule:
    - cron: "0 15 * * *"   # 매일 00:00 (서울)
  workflow_dispatch:        # Actions 탭에서 바로 돌려 볼 수 있음

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # 밝은 화면: 디자인 가이드 「톱니」 색 (잔디 paper-deep→sand→navy-ring→navy→ink, 뱀 orange)
          # 어두운 화면: GitHub 기본 어두운 잔디 + 뱀 orange
          outputs: |
            dist/snake-light.svg?color_snake=#E0793C&color_dots=#EFEBE2,#E1D8C5,#4D6A9C,#2E4A7D,#1F2430
            dist/snake-dark.svg?palette=github-dark&color_snake=#E0793C

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
