# 저장 위치: errorinusermane/errorinusermane 저장소의 .github/workflows/snake.yml
# 매일 한 번 잔디 그래프를 따라가는 뱀 그림을 다시 그려 output 브랜치에 올린다.
name: generate snake

on:
  schedule:
    - cron: "0 15 * * *"   # 매일 00:00 (서울)
  workflow_dispatch:        # Actions 탭에서 바로 돌려 볼 수 있음
  push:                    # 이 파일을 고쳐 main에 올리면 바로 다시 그림
    branches: [main]
    paths: [".github/workflows/snake.yml"]

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.SNAKE_TOKEN }}   # 비공개 기여까지 읽도록 개인 토큰(read:user) 사용
          # 시안 A · 남색 단계 (디자인 가이드 「톱니」): 잔디는 옅은 남색 → navy 한 색으로 진해지고, 뱀은 orange
          outputs: |
            dist/snake-light.svg?color_snake=#E0793C&color_dots=#EFEBE2,#D6DEEB,#9DB0D0,#4D6A9C,#2E4A7D
            dist/snake-dark.svg?color_snake=#E0793C&color_dots=#161b22,#1F2A40,#2E4A7D,#4D6A9C,#9DB0D0

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
